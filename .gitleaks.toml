# gitleaks configuration -- the secret scan in CI (.github/workflows/ci.yml), the only one: there
# is no local hook. Extends the stock ruleset with an allowlist and custom rules.

[extend]
useDefault = true

# docs/runbooks/cli-guide.md (retired 2026-10-23, still in history) was a walkthrough built almost entirely out of
# copy-pasted `passfort-cli` session transcripts: demo vault UUIDs, and sample
# `passfort-cli gen` output (high-entropy by construction). The stock
# `generic-api-key` rule flags these on entropy alone. They are illustrative
# output for a vault that never existed -- not credentials. Scope the allowlist
# to that one file so a real secret pasted anywhere else still trips the scan.
[allowlist]
description = "Example CLI transcripts in the runbook guide -- demo UUIDs and generated-sample passwords, not real secrets"
paths = ['''docs/runbooks/cli-guide\.md''']

# --- Cloud/ (M5) -------------------------------------------------------------
# Cloud/ moved to the private PassFortCloud repository (architecture.md rev 15).
# The rules stay: this repository's history still contains it.
# gitleaks 8.21.2's stock ruleset does not recognise any of the secrets the Azure
# backend holds: a planted Storage connection string and JWT key in
# Cloud/api/local.settings.json both scanned clean (m5-sync.md Phase 1.1). These
# rules close that gap. Placeholders in local.settings.example.json start with
# `replace-with-` and are allowlisted per rule, not by path, so a real value
# pasted into the example file still trips the scan.

# A Storage account key is 64 random bytes: 86 base64 chars + `==`. The Azurite
# emulator's well-known development key is public (Microsoft docs) and allowed.
[[rules]]
id = "azure-storage-account-key"
description = "Azure Storage account key (connection string AccountKey=)"
regex = '''(?i)AccountKey=([A-Za-z0-9+/]{86}==)'''
secretGroup = 1
keywords = ["accountkey"]
[rules.allowlist]
regexes = ['''^Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==$''']

# The two PassFort app settings that are secrets (m5-sync.md A.1), in any of the
# shapes they appear in: JSON (`"NAME": "v"`), env (`NAME=v`), YAML (`NAME: v`).
[[rules]]
id = "passfort-jwt-key"
description = "PassFort session-token signing key (PASSFORT_JWT_KEY)"
regex = '''PASSFORT_JWT_KEY["']?\s*[:=]\s*["']?([^"'\s,}]{16,})'''
secretGroup = 1
keywords = ["passfort_jwt_key"]
[rules.allowlist]
regexes = ['''^replace-with-''', '''^\$\{\{''']

[[rules]]
id = "passfort-enroll-secret"
description = "PassFort vault-enrollment secret (PASSFORT_ENROLL_SECRET)"
regex = '''PASSFORT_ENROLL_SECRET["']?\s*[:=]\s*["']?([^"'\s,}]{8,})'''
secretGroup = 1
keywords = ["passfort_enroll_secret"]
[rules.allowlist]
regexes = ['''^replace-with-''', '''^\$\{\{''']
