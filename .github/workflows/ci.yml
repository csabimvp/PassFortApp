# Five jobs (architecture.md §13.2): swift (the Swift build and tests), native (CMake + Catch2 over
# PFCrypto, plain and under ASan/UBSan), deps (Package.resolved drift), lint (shellcheck,
# clang-format), secrets (gitleaks, full history). The sync backend and its CI and deploy live in
# the PassFortCloud repository (architecture.md rev 15).
# Verifies a clean build only: never regenerates the Botan amalgamation, and holds
# no credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # macos-26, not macos-15: the .xcodeproj targets MACOSX_DEPLOYMENT_TARGET
    # 26.5 (Xcode 26.6 default, architecture.md §4.1), so PassFortTests will not
    # run on an older host even though the app builds there. The native/deps jobs
    # only need `swift` + CMake and stay on macos-15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1       # the one third-party action; SHA-pin to lock it
        with:
          xcode-version: latest-stable           # or pin exactly: '26.6' (architecture.md §4.1)
      - run: swift --version
      - name: Cache SwiftPM build (holds the slow Botan compile + the pf-killtest helper)
        uses: actions/cache@v6
        with:
          path: Packages/PassFortKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/PassFortKit/Package.swift', 'Packages/PassFortKit/Package.resolved') }}

      # A fresh checkout must carry the migration-fixture vaults (§13.4): .gitignore
      # blanket-ignores *.sqlite and then negates this one path. Break that and
      # `checkedInV1FixtureStillMigrates` fails with a confusing "missing fixture" --
      # catch it here, up front, with a clear message.
      - name: Migration fixtures present in the checkout
        run: test -f Packages/PassFortKit/Tests/PassFortVaultTests/Fixtures/v1/vault.sqlite

      - name: Build and test
        working-directory: Packages/PassFortKit
        # `swift build` builds every target, including the non-product `pf-killtest`
        # executable the §8.2 mid-write kill test spawns; PF_KILLTEST_BIN points the
        # test straight at it instead of having it guess a path.
        #
        # `swift test` covers, over Packages/PassFortKit: the M1 seam round-trip and
        # boundary fuzz, and the whole M2 storage suite -- VaultRepository transaction
        # atomicity, tombstones, the migration-fixture tests (§13.4), the anti-rollback
        # delete-a-row / restore-old-file tests, and the mid-write kill test -- plus VaultBackup
        # (WAL-safe snapshot, restore, retention, and that a backup carries no plaintext).
        env:
          PF_KILLTEST_BIN: ${{ github.workspace }}/Packages/PassFortKit/.build/debug/pf-killtest
        run: |
          swift build
          swift test
      - name: Format check
        working-directory: Packages/PassFortKit
        run: swift format lint --strict --recursive Sources Tests

      # The app's colours are generated from UI/tokens.json and committed; a hand edit to
      # either output, or a token change without regenerating, shows up as a diff here.
      - name: Palette matches UI/tokens.json
        run: |
          swift scripts/gen_palette.swift
          git diff --exit-code PassFort/Support/PaletteTokens.swift \
            PassFort/Assets.xcassets/AccentColor.colorset/Contents.json

      # The M3 app compiles, unsigned (architecture.md §13.4). Needs the PassFort
      # scheme shared into xcshareddata/. This resolves + builds the local package
      # through Xcode (a second Botan compile), so it is the slow step -- see
      # architecture.md §14 open decision 16 (hosted vs self-hosted runner).
      - name: App builds (unsigned)
        run: |
          xcodebuild build \
            -project PassFort.xcodeproj -scheme PassFort \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: App tests
        run: |
          xcodebuild test \
            -project PassFort.xcodeproj -scheme PassFort \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  native:
    runs-on: macos-15            # the linux job (M6 Phase 5) runs these on Linux
    steps:
      - uses: actions/checkout@v5
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: native-tests/build
          key: cmake-${{ runner.os }}-${{ hashFiles('native-tests/CMakeLists.txt', 'Packages/PassFortKit/Sources/PFCrypto/vendor/botan/**/botan_all.*') }}
      - run: cmake -S native-tests -B native-tests/build
      - run: cmake --build native-tests/build
      - run: ctest --test-dir native-tests/build --output-on-failure
      - name: Same suites under ASan + UBSan (separate, uncached build dir)
        run: |
          cmake -S native-tests -B native-tests/build-san \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          cmake --build native-tests/build-san
          ctest --test-dir native-tests/build-san --output-on-failure

  deps:
    runs-on: macos-15            # Swift ships with the default Xcode; no build here
    steps:
      - uses: actions/checkout@v5
      - name: Package.resolved is committed and has not drifted
        working-directory: Packages/PassFortKit
        # One lockfile, every dependency: swift-argument-parser (M1) and GRDB (M2). A
        # version bump must land as its own reviewed commit (§3.2, the A7 mitigation),
        # never as a silent resolve on a contributor's machine.
        run: |
          swift package resolve
          git diff --exit-code Package.resolved

  lint:
    runs-on: ubuntu-latest       # shellcheck ships on the image
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh
      - name: Pin clang-format to the dev toolchain version
        run: pipx install "clang-format==23.1.0"   # match Homebrew clang-format locally; bump deliberately
      - name: clang-format -- our C++ only, never vendor/
        run: |
          clang-format --version
          # One file per invocation: clang-format 23.1.0 mangles a long argv and
          # exits non-zero with "File name too long" before checking anything.
          git ls-files '*.cpp' '*.hpp' | grep -v '/vendor/' \
            | xargs -r -n1 clang-format --dry-run -Werror

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                        # full history for the scan
      # The repo's only secret scan -- nothing is installed locally. Runs here, on a throwaway
      # runner, from a pinned release binary.
      - name: Fetch gitleaks
        run: |
          V=8.21.2                              # bump deliberately
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Self-test -- the custom rules catch planted secrets
        # Fake secrets generated here, at run time, outside the checkout: none is ever committed.
        # Each custom rule in .gitleaks.toml must fire, or the scan below proves nothing for them.
        run: |
          T=$(mktemp -d)
          rnd() { head -c "$1" /dev/urandom | base64 -w0; }
          printf 'DefaultEndpointsProtocol=https;AccountName=x;AccountKey=%s;\n' "$(rnd 64)" > "$T/storage.txt"
          printf '{ "PASSFORT_JWT_KEY": "%s" }\n' "$(rnd 32)" > "$T/jwt.json"
          printf 'PASSFORT_ENROLL_SECRET=%s\n' "$(rnd 24)" > "$T/enroll.env"
          ./gitleaks detect --no-git --source "$T" --config .gitleaks.toml --no-banner --redact \
            --report-format json --report-path "$T/report.json" --exit-code 0
          for rule in azure-storage-account-key passfort-jwt-key passfort-enroll-secret; do
            jq -e --arg r "$rule" 'any(.[]; .RuleID == $r)' "$T/report.json" > /dev/null \
              || { echo "::error::gitleaks rule $rule missed its planted secret"; exit 1; }
          done
      - name: gitleaks -- full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

